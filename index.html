<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f4f6">
  <meta name="description" content="파이어 엠블렘 만자천홍 4개 루트 부대 편성·육성 플래너">
  <title>만자천홍 부대 편성실</title>
  <script>try{var s=JSON.parse(localStorage.getItem('banshisenko-planner:v1'));document.documentElement.dataset.theme=(s&&s.settings&&s.settings.theme)||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
  <link rel="icon" href="icon.svg?v=21a4fd13251e" type="image/svg+xml">
  <link rel="stylesheet" href="fonts/pretendard/pretendard.css?v=2973bcae8026">
  <link rel="stylesheet" href="styles.css?v=37e698969cdc">
  <script defer src="catalog.js?v=e07a9efd24f3"></script>
  <script defer src="portraits.js?v=d7a02b7227cc"></script>
  <script defer src="gifts.js?v=cfaa283306c5"></script>
  <script defer src="recruit.js?v=2d2d548e1370"></script>
  <script defer src="sync.js?v=1e0220183790"></script>
  <script defer src="core.js?v=ebbfb341ba9a"></script>
  <script defer src="app.js?v=5124d67b2e0e"></script>
</head>
<body>
<header class="topbar" id="topbar">
  <a class="brand" href="./" aria-label="만자천홍 부대 편성실">
    <img src="icon.svg?v=21a4fd13251e" alt="" width="28" height="28">
    <span>부대 편성실</span>
  </a>
  <nav id="route-tabs" class="route-tabs" aria-label="루트"></nav>
  <div class="top-actions">
    <div class="seg view-switch" role="group" aria-label="화면">
      <button data-act="view" data-view="planner">부대 편성</button>
      <button data-act="view" data-view="schedule">영입 스케줄</button>
      <button data-act="view" data-view="overview">루트 비교</button>
    </div>
    <button id="save-status" class="save-status" data-act="settings" title="동기화·백업 설정" aria-live="polite"></button>
    <button id="theme-btn" class="icon-btn" data-act="theme" aria-label="다크 모드 전환" title="다크 모드 전환"></button>
    <button id="settings-btn" class="icon-btn" data-act="settings" aria-label="설정" title="설정"></button>
  </div>
</header>

<div id="banner" class="banner" hidden></div>

<main id="main">
  <div id="planner" class="planner" data-pane="squad">
    <section class="col col-list" aria-label="캐릭터 목록">
      <div class="list-tools">
        <label class="search">
          <span class="search-icon" aria-hidden="true"></span>
          <input id="search" type="search" placeholder="이름·초성·특성" autocomplete="off" aria-label="캐릭터 검색">
          <kbd>/</kbd>
        </label>
        <div class="seg assign-seg" id="assign-seg" role="group" aria-label="배정 상태">
          <button data-act="assign" data-assign="all">전체</button>
          <button data-act="assign" data-assign="route">이 루트</button>
          <button data-act="assign" data-assign="planned">배정됨</button>
          <button data-act="assign" data-assign="unassigned">미배정</button>
        </div>
        <div class="chip-row">
          <button id="filter-btn" class="chip filter-chip" data-act="toggle-filters" aria-expanded="false">필터</button>
          <span id="quick-chips" class="quick-chips"></span>
        </div>
        <div id="filter-panel" class="filter-panel" hidden></div>
        <div class="list-meta">
          <span id="list-count"></span>
          <button id="recruit-toggle" class="chip recruit-toggle" data-act="recruit-only"></button>
          <label class="sort">정렬 <select id="sort"></select></label>
        </div>
      </div>
      <ul id="char-list" class="char-list"></ul>
      <div id="compare-bar" class="compare-bar" hidden></div>
    </section>

    <section class="col col-squad" id="squad-col" aria-label="부대">
      <div class="col-head">
        <div>
          <h2 id="squad-title"></h2>
          <p id="squad-sub" class="col-sub"></p>
        </div>
        <button class="btn sm" data-act="focus-search">+ 동료 추가</button>
      </div>
      <div id="squad-alerts"></div>
      <div id="squad-body"></div>
      <p id="squad-hidden" class="squad-hidden" hidden></p>
    </section>

    <section class="col col-stats" id="stats" aria-label="부대 분석"></section>
  </div>

  <div id="schedule" class="schedule" hidden></div>
  <div id="overview" class="overview" hidden></div>
</main>

<nav id="bottom-nav" class="bottom-nav" aria-label="화면">
  <button data-act="pane" data-pane="list"><span data-icon="user"></span>캐릭터</button>
  <button data-act="pane" data-pane="squad"><span data-icon="shield"></span>부대</button>
  <button data-act="pane" data-pane="stats"><span data-icon="bars"></span>분석</button>
  <button data-act="pane" data-pane="schedule"><span data-icon="calendar"></span>영입</button>
  <button data-act="pane" data-pane="overview"><span data-icon="grid"></span>루트 비교</button>
</nav>

<div id="scrim" class="scrim" data-act="close-drawer"></div>
<aside id="drawer" class="drawer" aria-hidden="true" aria-labelledby="drawer-title"></aside>
<dialog id="modal" class="modal"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<input id="import-file" type="file" accept="application/json,.json" hidden>
<noscript><p class="noscript">이 앱을 사용하려면 JavaScript를 켜주세요.</p></noscript>
</body>
</html>
