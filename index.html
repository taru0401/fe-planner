<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ee">
  <meta name="description" content="만자천홍 개인 부대 편성 및 육성 플래너. 4개 루트의 빌드를 로컬에 저장합니다.">
  <title>만자천홍 · 부대 편성실</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script defer src="catalog.js"></script>
  <script defer src="core.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
<a class="skip" href="#main">본문으로 이동</a>
<header class="masthead">
  <a class="brand" href="./index.html" aria-label="만자천홍 부대 편성실 홈"><img src="icon.svg" alt="" width="38" height="38"><span><small>FIRE EMBLEM · 万紫千紅</small><strong>부대 편성실</strong></span></a>
  <nav class="main-nav" aria-label="주 메뉴"><button data-view="planner" class="active">부대 편성</button><button data-view="overview">4개 루트 비교</button><button data-action="sources">자료 안내</button></nav>
  <div class="header-actions"><span id="save-status" role="status">자동 저장</span><button class="icon-button" data-action="theme" aria-label="다크모드 전환" title="다크모드 전환">◐</button><button data-action="settings" class="icon-button" aria-label="백업 및 설정" title="백업 및 설정">⚙</button></div>
</header>
<div id="storage-warning" class="banner" hidden></div>
<main id="main">
  <section class="page-intro"><div><p class="eyebrow">MY CAMPAIGN / 나의 육성 기록</p><h1 id="page-title">다음 전투를 위한 편성</h1><p id="page-description">마음에 드는 동료를 모으고, 루트마다 새로운 빌드를 만들어보세요.</p></div><div class="intro-tools"><button class="protection" data-action="settings" id="spoiler-status">◇ 2부까지 공개</button><button data-action="export" class="quiet">↓ 데이터 내보내기</button></div></section>
  <nav id="route-tabs" class="route-tabs" aria-label="루트 선택"></nav>
  <div class="mobile-tabs" aria-label="편성 화면"><button data-pane="catalog">캐릭터</button><button data-pane="squad" class="active">부대</button><button data-pane="stats">통계</button></div>
  <section id="planner-view" class="workspace" data-pane="squad">
    <aside id="catalog" class="panel catalog-panel">
      <div class="panel-heading"><h2>캐릭터</h2><span id="catalog-count" class="count"></span></div>
      <div class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="이름, 특성, 태그 검색" aria-label="캐릭터 검색" autocomplete="off"><kbd>/</kbd></div>
      <div class="filter-top"><select id="assignment-filter" aria-label="루트 배정 필터"><option value="all">전체 캐릭터</option><option value="current">현재 루트</option><option value="planned">사용 예정 · 모든 루트</option><option value="unassigned">미배정</option></select><button data-action="filters" id="filter-button" aria-expanded="false">필터 +</button></div>
      <div id="filters" class="filters" hidden></div>
      <div id="quick-filters" class="chips"></div>
      <div id="character-list" class="character-list"></div>
      <div class="catalog-footer"><span>선택해 상세 확인 · 드래그해 부대에 추가</span><button data-action="compare" id="compare-button" disabled>후보 비교 0/3</button></div>
    </aside>
    <section class="panel squad-panel" id="squad">
      <div class="squad-heading"><div><p class="eyebrow" id="route-kicker"></p><h2><span id="squad-title"></span> <span id="squad-count" class="count"></span></h2></div><button class="quiet" data-action="focus-search">+ 동료 찾기</button></div>
      <div id="squad-summary" class="squad-summary"></div>
      <div class="table-caption"><span>동료 / 이번 루트의 빌드</span><span>성장률: 힘 · 마력 · 속도</span></div>
      <div id="squad-list" class="squad-list"></div>
      <div class="drop-hint">+ 캐릭터를 이곳으로 끌어오거나 목록에서 추가하세요</div>
      <p class="subtle squad-note">한 동료를 여러 루트에 배치할 수 있습니다. 빌드는 루트별로 따로 저장됩니다.</p>
    </section>
    <aside id="stats" class="panel stats-panel"></aside>
  </section>
  <section id="overview-view" hidden></section>
  <footer class="page-footer"><span>만자천홍 · 개인 육성 플래너</span><span>내 브라우저에 저장 · 계정 없이 사용</span><span id="data-version"></span></footer>
</main>
<dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-title"></dialog>
<dialog id="class-dialog" class="class-dialog" aria-labelledby="class-title"></dialog>
<dialog id="utility-dialog" class="utility-dialog" aria-labelledby="utility-title"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<input id="import-file" type="file" accept="application/json,.json" hidden>
<noscript>이 앱을 사용하려면 브라우저의 JavaScript를 활성화해주세요.</noscript>
</body>
</html>
